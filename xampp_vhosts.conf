<VirtualHost *:443>
    ServerName khabribaba.com
    DocumentRoot "D:/xampp/htdocs/khabribaba/frontend/.next"
    SSLEngine on
    SSLCertificateFile "D:/xampp/apache/conf/ssl.crt/khabribaba.crt"
    SSLCertificateKeyFile "D:/xampp/apache/conf/ssl.key/khabribaba.key"
    <Directory "D:/xampp/htdocs/khabribaba/frontend/.next">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ProxyPass /cms http://localhost:1337/cms
    ProxyPassReverse /cms http://localhost:1337/cms
</VirtualHost> 